<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 709" width="1260" height="709" role="img" aria-labelledby="t">
  <title id="t">A UX review findings table: Nielsen, Laws of UX, and Tog lenses, each with a finding and a severity score from 0 to 4</title>
  <style>
    :root { --bg:#F2F2EF; --panel:#FCFCF9; --ink:#2D2D2D; --muted:#6D6D6D; --line:rgba(45,45,45,.14); --accent:#B03030; --chip:rgba(45,45,45,.08); --on-accent:#FCFCF9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#202020; --panel:#181818; --ink:#D8D8D8; --muted:#A3A3A3; --line:rgba(252,252,249,.15); --accent:#E08080; --chip:rgba(252,252,249,.10); --on-accent:#181818; }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .rule { stroke: var(--line); stroke-width: 1.5; }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .accent { fill: var(--accent); }
    .on-accent { fill: var(--on-accent); }
    .chip { fill: var(--chip); }
    .bar { fill: var(--muted); opacity: .35; }
    .sans { font-family: Lato, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
    .h { font-size: 15px; font-weight: 900; letter-spacing: .12em; }
    .lens { font-size: 24px; font-weight: 700; }
    .sev { font-size: 22px; font-weight: 900; }
  </style>

  <rect class="bg" width="1260" height="709"/>

  <g transform="translate(-126 30.5) scale(1.2)">

  <!-- window -->
  <rect class="panel" x="150" y="60" width="960" height="420" rx="10"/>
  <circle class="chip" cx="182" cy="92" r="7"/>
  <circle class="chip" cx="206" cy="92" r="7"/>
  <circle class="chip" cx="230" cy="92" r="7"/>
  <text class="mono muted" x="630" y="98" text-anchor="middle" font-size="17">ux-review-skills / findings</text>
  <line class="rule" x1="150" y1="124" x2="1110" y2="124"/>

  <!-- header -->
  <text class="sans muted h" x="190" y="168">LENS</text>
  <text class="sans muted h" x="470" y="168">FINDING</text>
  <text class="sans muted h" x="990" y="168">SEVERITY</text>
  <line class="rule" x1="190" y1="188" x2="1070" y2="188"/>

  <!-- row 1: Nielsen -->
  <text class="sans ink lens" x="190" y="240">Nielsen</text>
  <rect class="bar" x="470" y="222" width="400" height="12" rx="6"/>
  <rect class="bar" x="470" y="244" width="260" height="12" rx="6"/>
  <rect class="chip" x="990" y="214" width="44" height="40" rx="6"/>
  <text class="sans ink sev" x="1012" y="242" text-anchor="middle">3</text>
  <line class="rule" x1="190" y1="284" x2="1070" y2="284"/>

  <!-- row 2: Laws of UX -->
  <text class="sans ink lens" x="190" y="336">Laws of UX</text>
  <rect class="bar" x="470" y="318" width="340" height="12" rx="6"/>
  <rect class="bar" x="470" y="340" width="300" height="12" rx="6"/>
  <rect class="chip" x="990" y="310" width="44" height="40" rx="6"/>
  <text class="sans ink sev" x="1012" y="338" text-anchor="middle">2</text>
  <line class="rule" x1="190" y1="380" x2="1070" y2="380"/>

  <!-- row 3: Tog — highest severity, accented -->
  <text class="sans ink lens" x="190" y="432">Tog</text>
  <rect class="bar" x="470" y="414" width="420" height="12" rx="6"/>
  <rect class="bar" x="470" y="436" width="200" height="12" rx="6"/>
  <rect class="accent" x="990" y="406" width="44" height="40" rx="6"/>
  <text class="sans sev on-accent" x="1012" y="434" text-anchor="middle">4</text>
  </g>
</svg>
