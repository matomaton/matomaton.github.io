<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Prototypes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --surface: #ffffff;
      --text: #1c1c1c;
      --muted: #6b6b6b;
      --border: #e4e4e2;
      --accent: #2456d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --surface: #1f1f1f;
        --text: #ececec;
        --muted: #9a9a9a;
        --border: #333;
        --accent: #7ea2ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Lato', system-ui, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
    h1 { font-size: 2rem; font-weight: 900; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--border); }
    li { border-bottom: 1px solid var(--border); }
    a {
      display: block;
      padding: 16px 4px;
      color: var(--text);
      text-decoration: none;
    }
    a:hover .title, a:focus-visible .title { color: var(--accent); text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .title { display: block; font-weight: 700; font-size: 1.05rem; }
    .file { display: block; color: var(--muted); font-size: 0.85rem; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>Prototypes</h1>
    <p class="sub" id="count">Interactive prototypes shared for review.</p>
    <ul id="list"></ul>
  </main>

  <script>
    // Fallback list, used if the GitHub API is unavailable (e.g. rate-limited or viewing locally).
    const FALLBACK = [
      'calendar-prototype.html',
      'calendar-travel-drag-prototype.html',
      'Chatbot_Plan_a_Trip_Before_After_Prototype.html',
      'chatbot-recommendations.html',
      'data-table-hybrid-comfort-ask.html',
      'data-table-wrap-all.html'
    ];
    const API = 'https://api.github.com/repos/matomaton/matomaton.github.io/contents/PROTO';
    const GENERIC_TITLES = /^(protected prototype|document|untitled)$/i;

    function prettify(name) {
      return name.replace(/\.html?$/i, '').replace(/[-_]+/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    async function getFiles() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(res.status);
        const items = await res.json();
        return items
          .filter(i => i.type === 'file' && /\.html?$/i.test(i.name) && i.name.toLowerCase() !== 'index.html')
          .map(i => i.name);
      } catch {
        return FALLBACK;
      }
    }

    async function getTitle(name) {
      try {
        const res = await fetch(encodeURI(name));
        if (!res.ok) return null;
        const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        const t = doc.title.trim();
        return t && !GENERIC_TITLES.test(t) ? t : null;
      } catch {
        return null;
      }
    }

    (async () => {
      const files = (await getFiles()).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      const list = document.getElementById('list');
      document.getElementById('count').textContent =
        `${files.length} interactive prototype${files.length === 1 ? '' : 's'} shared for review.`;

      for (const name of files) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = encodeURI(name);
        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = prettify(name);
        const file = document.createElement('span');
        file.className = 'file';
        file.textContent = name;
        a.append(title, file);
        li.append(a);
        list.append(li);
        getTitle(name).then(t => { if (t) title.textContent = t; });
      }
    })();
  </script>
</body>
</html>
