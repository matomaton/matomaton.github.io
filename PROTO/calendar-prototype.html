<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar itinerary — resize &amp; move prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #202b46;
      --hgv-blue: #1b5a7d;
      --blue-fill: rgba(0, 115, 230, 0.2);
      --blue-solid: #8bb9d2;
      --green-fill: rgba(0, 176, 185, 0.2);
      --green-solid: #5fb8be;
      --green-bar: #018289;
      --yellow-fill: rgba(201, 148, 53, 0.2);
      --yellow-solid: #e0b86a;
      --yellow-bar: #c99435;
      --pending-fill: rgba(0, 115, 230, 0.12);
      --text: #202b46;
      --muted: #53565a;
      --line: #e3e3e3;
      --grid: #dedfdf;
      --subtle: #cdcdcd;
      --nav: #f1f1f1;
      --white: #fff;
      --hour-px: 76px;
      --gutter: 56px;
      --radius: 4px;
      --shadow: 0 15px 20px rgba(32, 43, 70, 0.05);
      --cascade-step: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Montserrat, "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(27, 90, 125, 0.35), transparent 55%),
        radial-gradient(900px 500px at 100% 100%, rgba(1, 130, 137, 0.28), transparent 50%),
        linear-gradient(160deg, #1a4a68 0%, #3d6d7a 45%, #7aa39a 100%);
      min-height: 100%;
    }

    .stage {
      min-height: 100%;
      padding: 28px 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .proto-label {
      color: rgba(255,255,255,0.88);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .proto-hint {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      margin: 0 0 6px;
    }

    .calendar {
      background: var(--white);
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      box-shadow: 0 24px 60px rgba(16, 28, 48, 0.28);
      overflow: hidden;
    }

    .nav {
      display: grid;
      grid-template-columns: 48px 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      background: var(--nav);
      padding: 8px 16px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 30px;
      background: var(--white);
      color: var(--navy);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .nav-btn:focus-visible { outline: 2px solid var(--hgv-blue); outline-offset: 2px; }

    .nav-side {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--navy);
      background: none;
      border: 0;
      cursor: default;
    }
    .nav-side.next { justify-content: flex-end; }
    .range {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      background: none;
      border: 0;
      color: var(--navy);
      cursor: default;
    }

    .days-head, .allday, .grid-wrap {
      display: grid;
      grid-template-columns: var(--gutter) 1fr 1fr 1fr;
    }

    .day-label {
      border-left: 1px solid var(--line);
      text-align: center;
      padding: 4px 0 8px;
      color: var(--muted);
    }
    .day-label .dow {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .day-label .num {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .rule { height: 1px; background: var(--subtle); grid-column: 2 / -1; }

    .allday { padding: 6px 0 10px; align-items: start; }
    .allday-col {
      border-right: 1px solid var(--subtle);
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 48px;
    }
    .allday-col:last-child { border-right: 0; }

    .seg {
      position: relative;
      border-radius: var(--radius);
      overflow: visible;
      cursor: pointer;
      user-select: none;
      box-shadow: var(--shadow);
    }
    .seg.timed { cursor: grab; }
    .seg.timed.is-moving { cursor: grabbing; }
    .seg:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
    .seg .body {
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }
    .seg.theme-blue .body { background: var(--blue-fill); border-left: 4px solid var(--hgv-blue); }
    .seg.theme-blue:hover .body,
    .seg.theme-blue.is-resizing .body,
    .seg.theme-blue.is-moving .body,
    .seg.theme-blue.show-handles .body { background: var(--blue-solid); }
    .seg.theme-green .body { background: var(--green-fill); border-left: 4px solid var(--green-bar); }
    .seg.theme-green:hover .body,
    .seg.theme-green.is-resizing .body,
    .seg.theme-green.is-moving .body { background: var(--green-solid); }
    .seg.theme-gold .body { background: var(--yellow-fill); border-left: 4px solid var(--yellow-bar); border-radius: 8px; }
    .seg.theme-gold:hover .body,
    .seg.theme-gold.is-resizing .body,
    .seg.theme-gold.is-moving .body { background: var(--yellow-solid); }
    .seg.theme-travel .body {
      background: var(--green-fill);
      border-left: 0;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--navy);
      min-height: 16px;
    }
    .seg.theme-travel:hover .body,
    .seg.theme-travel.is-resizing .body,
    .seg.theme-travel.is-moving .body { background: var(--green-solid); }
    .seg.pending .body {
      background: var(--pending-fill);
      border: 1px dashed var(--hgv-blue);
      border-left: 1px dashed var(--hgv-blue);
    }
    .seg.allday-bar .body {
      min-height: 15px;
      padding: 0 16px;
      justify-content: center;
    }
    .seg.allday-bar .title { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; line-height: 15px; }

    .pad { padding: 8px 16px; display: flex; flex-direction: column; gap: 0; min-height: 0; flex: 1; }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 24px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--navy);
      min-width: 0;
    }
    .meta span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta svg { flex: none; }
    .sub { font-size: 11px; color: var(--muted); line-height: 16px; }

    .photo {
      height: 118px;
      flex: none;
      width: 100%;
      object-fit: cover;
      display: block;
    }

    .overnight-tick {
      position: absolute;
      left: 50%;
      width: 42px;
      height: 6px;
      margin-left: -21px;
      background: var(--navy);
      border-radius: 2px 2px 0 0;
      z-index: 3;
      pointer-events: none;
    }
    .overnight-tick.top { top: 0; border-radius: 0 0 2px 2px; }
    .overnight-tick.bottom { bottom: 0; }

    .handle {
      position: absolute;
      left: 50%;
      width: 100px;
      height: 8px;
      margin-left: -50px;
      background: var(--navy);
      border-radius: 8px;
      z-index: 4;
      cursor: ns-resize;
      opacity: 0;
      pointer-events: none;
      touch-action: none;
    }
    .seg:hover .handle,
    .seg.is-resizing .handle,
    .seg.is-moving .handle,
    .seg.show-handles .handle,
    .seg:focus-visible .handle {
      opacity: 1;
      pointer-events: auto;
    }
    .handle.top { top: -3px; }
    .handle.bottom { bottom: -3px; }

    .grid-wrap { position: relative; }
    .hours {
      display: flex;
      flex-direction: column;
    }
    .hour {
      height: var(--hour-px);
      border-top: 1px solid var(--grid);
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--navy);
      text-align: right;
      padding: 8px 8px 0 0;
      position: relative;
    }
    .hour.end {
      height: 28px;
    }
    .hour:not(.end)::after {
      content: "";
      position: absolute;
      left: var(--gutter);
      right: -300vw;
      top: 50%;
      border-top: 1px dashed var(--grid);
      pointer-events: none;
    }

    .lane {
      position: relative;
      border-left: 1px solid var(--line);
      height: calc(12 * var(--hour-px));
    }

    .timed {
      position: absolute;
      left: 4px;
      right: 8px;
    }

    .menu {
      position: fixed;
      z-index: 40;
      width: 245px;
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 18px 40px rgba(32, 43, 70, 0.18);
      padding: 8px 0;
      display: none;
    }
    .menu.open { display: block; }
    .menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border: 0;
      background: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--navy);
      text-align: left;
      cursor: pointer;
    }
    .menu button:hover { background: #f6f7f8; }
    .menu button + button { border-top: 1px solid #ececec; }

    .toast {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      display: none;
      z-index: 50;
      box-shadow: 0 8px 24px rgba(16, 28, 48, 0.35);
      white-space: nowrap;
    }
    .toast.show { display: block; }

    @media (prefers-reduced-motion: reduce) {
      .toast, .handle { transition: none; }
    }

    @media (max-width: 800px) {
      .stage { padding: 12px; }
      :root { --gutter: 42px; --hour-px: 64px; --cascade-step: 8px; }
      .title, .meta { font-size: 13px; }
      .handle { width: 72px; margin-left: -36px; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-left" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M10 3.5 5.5 8 10 12.5"/></symbol>
    <symbol id="i-right" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M6 3.5 10.5 8 6 12.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M3.5 6 8 10.5 12.5 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M8 5.2V8l2 1.4"/></symbol>
    <symbol id="i-plane" viewBox="0 0 16 16"><path fill="currentColor" d="M2.2 8.7 7.4 7.2 4.1 2.6l1.5-.5 5.2 3.4 3.1-.9c.7-.2 1.3.4 1.1 1.1l-.7 2.4-6.2 1.7-1.2 4.1-1.5.2-.2-4.1L2.4 10c-.6.2-1.1-.4-.9-1.1.1-.2.4-.3.7-.2z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.2" d="M8 14s4.2-4.1 4.2-7A4.2 4.2 0 0 0 8 2.8 4.2 4.2 0 0 0 3.8 7c0 2.9 4.2 7 4.2 7z"/><circle cx="8" cy="7" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.2"/><path stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M8 2.4v1.4M8 12.2v1.4M2.4 8h1.4M12.2 8h1.4M4 4l1 1M11 11l1 1M12 4l-1 1M5 11l-1 1"/></symbol>
    <symbol id="i-utensils" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M5 2.5v5M3.6 2.5v3.2A1.4 1.4 0 0 0 5 7.1V13.5M6.4 2.5v3.2A1.4 1.4 0 0 1 5 7.1M10.2 2.5c1.6 0 2.2 1.6 2.2 3.2V8H10.2V13.5"/></symbol>
    <symbol id="i-swap" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" d="M3 6h10M10.5 3.5 13 6l-2.5 2.5M13 10H3M5.5 7.5 3 10l2.5 2.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" d="M3.5 4.5h9M6.2 4.5V3.2h3.6v1.3M4.4 4.5l.6 8.2h6l.6-8.2"/></symbol>
  </svg>

  <div class="stage">
    <div class="toast" id="toast" role="status"></div>
    <div class="proto-label">Resize &amp; move prototype · cascade overlap</div>
    <p class="proto-hint">Drag a segment to move · Drag handles to resize · Overlap is allowed</p>
    <div class="calendar" id="calendar">
      <header class="nav">
        <button class="nav-btn" id="addBtn" type="button" aria-label="Add" title="Add (stub)">
          <svg width="16" height="16"><use href="#i-plus"/></svg>
        </button>
        <button class="nav-side" type="button" tabindex="-1">
          <svg width="16" height="16"><use href="#i-left"/></svg>
          Previous 3 Days
        </button>
        <button class="range" type="button" tabindex="-1">
          3 Days
          <svg width="16" height="16"><use href="#i-down"/></svg>
        </button>
        <button class="nav-side next" type="button" tabindex="-1">
          Next 3 Days
          <svg width="16" height="16"><use href="#i-right"/></svg>
        </button>
      </header>

      <div class="days-head">
        <div></div>
        <div class="day-label"><div class="dow">Wed</div><div class="num">9</div></div>
        <div class="day-label"><div class="dow">Thu</div><div class="num">10</div></div>
        <div class="day-label"><div class="dow">Fri</div><div class="num">11</div></div>
      </div>
      <div class="days-head"><div></div><div class="rule"></div></div>
      <div class="allday" id="allday"></div>
      <div class="grid-wrap">
        <div class="hours" id="hours"></div>
        <div class="lane" data-day="0"></div>
        <div class="lane" data-day="1"></div>
        <div class="lane" data-day="2"></div>
      </div>
    </div>
  </div>

  <div class="menu" id="menu" role="menu" aria-label="Segment actions">
    <button type="button" data-action="time" role="menuitem">
      <svg width="16" height="16"><use href="#i-clock"/></svg> Change time
    </button>
    <button type="button" data-action="replace" role="menuitem">
      <svg width="16" height="16"><use href="#i-swap"/></svg> Replace
    </button>
    <button type="button" data-action="delete" role="menuitem">
      <svg width="16" height="16"><use href="#i-trash"/></svg> Delete
    </button>
  </div>

  <script>
    const GRID_START = 8 * 60;
    const GRID_END = 20 * 60;
    const HOUR_PX = 76;
    const PX_PER_MIN = HOUR_PX / 60;
    const SNAP = 15;
    const MIN_DUR = 30;
    const CASCADE_STEP = 12;
    const MOVE_THRESHOLD_PX = 4;

    const ICONS = {
      clock: "i-clock",
      plane: "i-plane",
      pin: "i-pin",
      sun: "i-sun",
      utensils: "i-utensils",
    };

    let segments = [
      { id: "festival", day: 0, kind: "allday", theme: "blue", title: "Festival" },
      { id: "city-tour", day: 0, kind: "pending", theme: "blue", title: "City Tour", subtitle: "Pending" },
      { id: "joes-pending", day: 0, kind: "pending", theme: "blue", title: "Joe’s on Jolly", subtitle: "Pending" },
      { id: "boat", day: 1, kind: "pending", theme: "blue", title: "River Boat Ride: 2hrs", subtitle: "Pending" },
      { id: "unscheduled", day: 2, kind: "pending", theme: "blue", title: "Unscheduled", subtitle: "Pending" },

      { id: "flight", day: 1, kind: "event", theme: "green", title: "Delta Flight", start: 8 * 60, end: 10 * 60 + 30,
        rows: [{ icon: "clock", text: "time" }, { icon: "plane", text: "Flight" }, { icon: "sun", text: "Mostly Sunny" }] },
      { id: "drive-1", day: 1, kind: "travel", theme: "travel", title: "30 min drive", start: 10 * 60 + 30, end: 11 * 60 },
      { id: "resort", day: 1, kind: "event", theme: "gold", title: "Las Palmaras - A Hilton Grand Vacations Club", start: 11 * 60, end: 11 * 60 + 45,
        rows: [{ icon: "clock", text: "time" }] },
      { id: "walk", day: 1, kind: "travel", theme: "travel", title: "5 min walk", start: 11 * 60 + 50, end: 12 * 60 },
      { id: "lunch-thu", day: 1, kind: "event", theme: "blue", title: "Lunch at Joe’s on Jolly", start: 12 * 60, end: 13 * 60 + 30,
        rows: [{ icon: "clock", text: "time" }, { icon: "pin", text: "123 Jolly Rd, Lansing, Michigan" }] },
      /* Seeded cascade pair — stretch or move to deepen / clear overlap */
      { id: "tour", day: 1, kind: "event", theme: "blue", title: "Tour", start: 14 * 60, end: 17 * 60,
        rows: [{ icon: "clock", text: "time" }] },
      { id: "hike", day: 1, kind: "event", theme: "blue", title: "Hike", start: 14 * 60 + 30, end: 16 * 60 + 30,
        rows: [{ icon: "clock", text: "time" }] },

      { id: "beach", day: 2, kind: "event", theme: "blue", title: "Beach", start: 8 * 60, end: 10 * 60 + 30,
        photo: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=900&q=80&auto=format&fit=crop",
        rows: [{ icon: "clock", text: "time" }, { icon: "sun", text: "Mostly Sunny" }] },
      { id: "drive-2", day: 2, kind: "travel", theme: "travel", title: "30 min drive", start: 10 * 60 + 30, end: 11 * 60 },
      { id: "chinatown", day: 2, kind: "event", theme: "blue", title: "China Town", start: 11 * 60 + 15, end: 15 * 60 + 30,
        photo: "https://images.unsplash.com/photo-1474181487882-5abf3f0ba6c2?w=900&q=80&auto=format&fit=crop",
        rows: [{ icon: "clock", text: "time" }] },
      /* Partial overlap with China Town for Friday exploration */
      { id: "museum", day: 2, kind: "event", theme: "blue", title: "Museum Visit", start: 14 * 60, end: 16 * 60,
        rows: [{ icon: "clock", text: "time" }, { icon: "pin", text: "Main St" }] },
      { id: "drive-3", day: 2, kind: "travel", theme: "travel", title: "30 min drive", start: 16 * 60, end: 16 * 60 + 30 },
      { id: "lunch-fri", day: 2, kind: "event", theme: "blue", title: "Lunch at Joe’s on Jolly", start: 16 * 60 + 30, end: 19 * 60 + 30, overnight: true,
        rows: [
          { icon: "clock", text: "time" },
          { icon: "utensils", text: "Dining" },
          { icon: "pin", text: "123 Jolly Rd, Lansing, Michigan" },
          { icon: "sun", text: "Mostly Sunny" },
        ] },
    ];

    const hoursEl = document.getElementById("hours");
    const alldayEl = document.getElementById("allday");
    const lanes = [...document.querySelectorAll(".lane")];
    const menuEl = document.getElementById("menu");
    const toastEl = document.getElementById("toast");

    for (let h = 8; h <= 20; h++) {
      const mer = h >= 12 ? "PM" : "AM";
      const n = ((h + 11) % 12) + 1;
      const d = document.createElement("div");
      d.className = h === 20 ? "hour end" : "hour";
      d.textContent = n + " " + mer;
      hoursEl.appendChild(d);
    }

    function snap(min) { return Math.round(min / SNAP) * SNAP; }
    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
    function toClock(min, { compact } = {}) {
      const h24 = Math.floor(min / 60);
      const m = min % 60;
      const mer = h24 >= 12 ? "pm" : "am";
      const h = ((h24 + 11) % 12) + 1;
      const mm = String(m).padStart(2, "0");
      if (compact) return h + ":" + mm;
      return h + ":" + mm + mer;
    }
    function timeRange(s) {
      const sameMer = Math.floor(s.start / 60) >= 12 === Math.floor(s.end / 60) >= 12;
      if (sameMer) return toClock(s.start, { compact: true }) + "–" + toClock(s.end);
      return toClock(s.start) + " – " + toClock(s.end);
    }
    function icon(name) {
      return `<svg width="16" height="16" aria-hidden="true"><use href="#${ICONS[name] || name}"/></svg>`;
    }
    function isTimed(s) {
      return s.kind === "event" || s.kind === "travel";
    }
    function rangesOverlap(a, b) {
      return a.start < b.end && a.end > b.start;
    }

    function density(s) {
      const h = (s.end - s.start) * PX_PER_MIN;
      if (h < 40) return "slim";
      if (h < 88) return "mid";
      return "full";
    }

    /** Cascade stack indices for overlapping segments within a day. */
    function stackIndicesForDay(day) {
      const daySegs = segments.filter((s) => s.day === day && isTimed(s));
      const sorted = [...daySegs].sort((a, b) => {
        if (a.start !== b.start) return a.start - b.start;
        const da = a.end - a.start;
        const db = b.end - b.start;
        if (da !== db) return db - da;
        return a.id.localeCompare(b.id);
      });
      const stack = new Map();
      for (const s of sorted) {
        let maxIdx = -1;
        for (const other of sorted) {
          if (other === s) break;
          if (rangesOverlap(s, other)) {
            maxIdx = Math.max(maxIdx, stack.get(other.id) ?? 0);
          }
        }
        stack.set(s.id, maxIdx + 1);
      }
      return stack;
    }

    function layoutDay(day) {
      const stack = stackIndicesForDay(day);
      const daySegs = segments.filter((s) => s.day === day && isTimed(s));
      for (const s of daySegs) {
        const el = document.querySelector(`.lane[data-day="${day}"] [data-id="${s.id}"]`);
        if (!el) continue;
        const idx = stack.get(s.id) || 0;
        const inset = idx * CASCADE_STEP;
        const elevating = el.classList.contains("is-moving") || el.classList.contains("is-resizing");
        el.style.left = 4 + inset + "px";
        el.style.right = "8px";
        el.style.zIndex = String(elevating ? 100 + idx : 10 + idx);
      }
    }

    function layoutAllDays() {
      for (let d = 0; d < 3; d++) layoutDay(d);
    }

    function render() {
      closeMenu();
      alldayEl.innerHTML = "<div></div>";
      lanes.forEach((l) => { l.innerHTML = ""; });
      for (let d = 0; d < 3; d++) {
        const col = document.createElement("div");
        col.className = "allday-col";
        segments.filter((s) => s.day === d && (s.kind === "allday" || s.kind === "pending")).forEach((s) => {
          col.appendChild(elFor(s));
        });
        alldayEl.appendChild(col);
      }
      segments.filter(isTimed).forEach((s) => {
        lanes[s.day].appendChild(elFor(s));
      });
      layoutAllDays();
    }

    function elFor(s) {
      const el = document.createElement("article");
      el.className = "seg theme-" + s.theme;
      el.dataset.id = s.id;
      el.setAttribute("role", "button");
      el.setAttribute("aria-label", s.title + (s.start != null ? ", " + timeRange(s) : ""));
      el.tabIndex = 0;
      if (s.kind === "pending") el.classList.add("pending");
      if (s.kind === "allday") el.classList.add("allday-bar");
      if (s.kind === "travel") el.classList.add("travel");

      const dens = s.start != null ? density(s) : "full";
      const showPhoto = s.photo && dens === "full";
      const showRows = dens !== "slim" && s.kind === "event";
      const rows = (s.rows || []).map((r) => {
        const text = r.text === "time" ? timeRange(s) : r.text;
        if (dens === "mid" && r.icon !== "clock") return "";
        return `<div class="meta">${icon(r.icon)}<span>${text}</span></div>`;
      }).join("");

      let inner = "";
      if (showPhoto) inner += `<img class="photo" alt="" src="${s.photo}">`;
      if (s.kind === "travel") {
        inner += `<div class="pad" style="padding:0;align-items:center;justify-content:center">${s.title}</div>`;
      } else if (s.kind === "pending") {
        inner += `<div class="pad"><div class="title" style="font-weight:500;color:var(--muted);font-size:13px;line-height:14px">${s.title}</div><div class="sub">${s.subtitle}</div></div>`;
      } else if (s.kind === "allday") {
        inner += `<div class="title">${s.title}</div>`;
      } else {
        inner += `<div class="pad"><div class="title">${s.title}</div>${showRows ? rows : `<div class="meta">${icon("clock")}<span>${timeRange(s)}</span></div>`}</div>`;
      }

      el.innerHTML = `<div class="body">${inner}</div>`;

      if (s.overnight) {
        el.insertAdjacentHTML("beforeend", '<span class="overnight-tick top"></span><span class="overnight-tick bottom"></span>');
      }

      if (isTimed(s)) {
        el.classList.add("timed");
        position(el, s);
        el.insertAdjacentHTML("beforeend", '<div class="handle top" data-edge="top"></div><div class="handle bottom" data-edge="bottom"></div>');
        bindInteractive(el, s);
      } else {
        bindClickOnly(el, s);
      }
      return el;
    }

    function position(el, s) {
      const top = (s.start - GRID_START) * PX_PER_MIN;
      const height = Math.max(16, (s.end - s.start) * PX_PER_MIN);
      el.style.top = top + "px";
      el.style.height = height + "px";
    }

    function bindClickOnly(el, s) {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        openMenu(el, s);
      });
    }

    function bindInteractive(el, s) {
      el.querySelectorAll(".handle").forEach((h) => {
        h.addEventListener("pointerdown", (e) => startResize(e, el, s, h.dataset.edge));
      });
      el.querySelector(".body").addEventListener("pointerdown", (e) => {
        if (e.target.closest(".handle")) return;
        if (e.button != null && e.button !== 0) return;
        startMove(e, el, s);
      });
      el.addEventListener("click", (e) => {
        if (e.target.closest(".handle")) return;
        if (ignoreClick) return;
        e.stopPropagation();
        openMenu(el, s);
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openMenu(el, s);
        }
      });
    }

    let ignoreClick = false;
    let active = null;
    let toastTimer;

    function startResize(e, el, s, edge) {
      e.preventDefault();
      e.stopPropagation();
      closeMenu();
      el.classList.add("is-resizing");
      e.target.setPointerCapture(e.pointerId);
      active = {
        mode: "resize",
        el, s, edge,
        startY: e.clientY,
        origStart: s.start,
        origEnd: s.end,
        moved: false,
      };
      layoutDay(s.day);
      window.addEventListener("pointermove", onPointerDrag);
      window.addEventListener("pointerup", onPointerUp, { once: true });
    }

    function startMove(e, el, s) {
      e.preventDefault();
      e.stopPropagation();
      closeMenu();
      el.classList.add("is-moving");
      el.setPointerCapture(e.pointerId);
      active = {
        mode: "move",
        el, s,
        startY: e.clientY,
        origStart: s.start,
        origEnd: s.end,
        moved: false,
      };
      layoutDay(s.day);
      window.addEventListener("pointermove", onPointerDrag);
      window.addEventListener("pointerup", onPointerUp, { once: true });
    }

    function onPointerDrag(e) {
      if (!active) return;
      const dy = e.clientY - active.startY;
      if (Math.abs(dy) >= MOVE_THRESHOLD_PX) active.moved = true;
      const dmin = snap(dy / PX_PER_MIN);
      const s = active.s;

      if (active.mode === "move") {
        const dur = active.origEnd - active.origStart;
        const nextStart = clamp(active.origStart + dmin, GRID_START, GRID_END - dur);
        s.start = nextStart;
        s.end = nextStart + dur;
      } else if (active.edge === "top") {
        s.start = clamp(active.origStart + dmin, GRID_START, active.origEnd - MIN_DUR);
      } else {
        s.end = clamp(active.origEnd + dmin, active.origStart + MIN_DUR, GRID_END);
      }

      if (s.kind === "travel") {
        const mins = s.end - s.start;
        s.title = mins + " min " + (s.title.includes("walk") ? "walk" : "drive");
      }

      refreshCard(active.el, s);
      layoutDay(s.day);
    }

    function refreshCard(el, s) {
      position(el, s);
      el.setAttribute("aria-label", s.title + ", " + timeRange(s));
      const dens = density(s);
      const showPhoto = s.photo && dens === "full";
      const body = el.querySelector(".body");
      if (s.kind === "travel") {
        body.innerHTML = `<div class="pad" style="padding:0;align-items:center;justify-content:center">${s.title}</div>`;
        return;
      }
      const rows = (s.rows || []).map((r) => {
        const text = r.text === "time" ? timeRange(s) : r.text;
        if (dens === "mid" && r.icon !== "clock") return "";
        if (dens === "slim") return "";
        return `<div class="meta">${icon(r.icon)}<span>${text}</span></div>`;
      }).join("");
      const photo = showPhoto ? `<img class="photo" alt="" src="${s.photo}">` : "";
      const timeLine = dens === "slim"
        ? `<div class="meta">${icon("clock")}<span>${timeRange(s)}</span></div>`
        : rows;
      body.innerHTML = `${photo}<div class="pad"><div class="title">${s.title}</div>${timeLine}</div>`;
    }

    function onPointerUp() {
      window.removeEventListener("pointermove", onPointerDrag);
      if (active) {
        active.el.classList.remove("is-resizing", "is-moving");
        layoutDay(active.s.day);
        if (active.moved) {
          ignoreClick = true;
          setTimeout(() => { ignoreClick = false; }, 0);
        }
      }
      active = null;
    }

    let menuSeg = null;
    function openMenu(anchor, s) {
      menuSeg = s;
      const r = anchor.getBoundingClientRect();
      menuEl.classList.add("open");
      const left = Math.min(window.innerWidth - 260, r.right + 8);
      const top = Math.min(window.innerHeight - 190, r.top);
      menuEl.style.left = Math.max(8, left) + "px";
      menuEl.style.top = Math.max(8, top) + "px";
    }
    function closeMenu() {
      menuEl.classList.remove("open");
      menuSeg = null;
    }

    menuEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || !menuSeg) return;
      const action = btn.dataset.action;
      const title = menuSeg.title;
      if (action === "time") {
        toast("Drag the segment to move, or use the handles to resize.");
      } else if (action === "replace") {
        toast("Replace is a stub in this prototype.");
      } else if (action === "delete") {
        segments = segments.filter((x) => x.id !== menuSeg.id);
        render();
        toast("Deleted “" + title + "”");
        return;
      }
      closeMenu();
    });

    document.addEventListener("click", (e) => {
      if (!menuEl.contains(e.target) && !e.target.closest(".seg")) closeMenu();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

    document.getElementById("addBtn").addEventListener("click", () => {
      toast("Add is a stub in this prototype.");
    });

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
    }

    render();
  </script>
</body>
</html>
